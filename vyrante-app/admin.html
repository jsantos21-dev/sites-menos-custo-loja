.adm-photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(123px,1fr));gap:10px;margin:15px 0 20px}

/* VYRANTE: per-event soundtrack controls. */
.event-music-config{margin-top:24px;padding:22px;border:1px solid #45564c;background:linear-gradient(135deg,#1a241e,#141b17);border-radius:7px}
.event-music-heading{display:flex;align-items:center;justify-content:space-between;gap:17px;margin-bottom:17px}
.event-music-heading h3{font-size:17px;letter-spacing:-.015em;margin:0 0 6px}

.audio-optin-note{border:1px solid #526558;color:#c4d5c4;padding:8px 11px;border-radius:20px;white-space:nowrap;font-size:10px}

.music-toggle{position:relative;display:flex;align-items:center;flex:0 0 43px;width:43px;height:26px}
.music-toggle input{appearance:none;position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;opacity:0;z-index:2;cursor:pointer}
.music-slider{display:block;position:relative;width:43px;height:25px;border-radius:20px;border:1px solid #607368;background:#34433a;transition:background .2s}
.music-slider::after{content:"";display:block;position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#e6e9df;transition:transform .2s}
.music-toggle input:checked+.music-slider{background:#769e78;border-color:#a5d0a0}
.music-toggle input:checked+.music-slider::after{transform:translateX(17px);background:#fff}
.music-toggle input:focus-visible+.music-slider{outline:2px solid white;outline-offset:3px}

<script>
'use strict';let state=null,csrf='',tab='overview',picked='',report=null;
const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cash=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));const input=(key,label,val,type='text',other='')=>`<label class="field"><span>${label}</span><input data-key="${key}" type="${type}" value="${esc(val)}" ${other}></label>`;const textarea=(key,label,val,rows=3)=>`<label class="field"><span>${label}</span><textarea data-key="${key}" rows="${rows}">${esc(val)}</textarea></label>`;
function flash(msg,error=false){let t=$('#toast');t.textContent=msg;t.classList.toggle('error',error);t.hidden=false;setTimeout(()=>t.hidden=true,4300)}
async function api(url,method='GET',body=null){const opts={method,credentials:'same-origin',headers:{}};if(method!=='GET')opts.headers['X-Admin-Token']=csrf;if(body!==null){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}const r=await fetch(url,opts);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`Erro ${r.status}`);return data;}
async function init(){try{const s=await api('/api/admin/session');if(s.authenticated){csrf=s.csrf;await reload();$('#loginWrap').hidden=true;$('#layout').hidden=false;showTab('overview');}}catch(e){console.error('Session check failed',e)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-toggle-password]');if(!b)return;const field=document.getElementById(b.dataset.togglePassword);if(!field)return;field.type=field.type==='password'?'text':'password';b.textContent=field.type==='password'?'Mostrar':'Ocultar';b.setAttribute('aria-label',b.textContent+' senha');});
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').hidden=true;try{const r=await api('/api/admin/login','POST',{username:$('#loginUser').value.trim(),password:$('#loginPass').value});csrf=r.csrf;$('#loginPass').value='';await reload();$('#loginWrap').hidden=true;$('#layout').hidden=false;showTab('overview')}catch(err){$('#loginError').hidden=false;$('#loginError').textContent=err.message}});
async function reload(){state=await api('/api/admin/state');$('#storageWarn').hidden=state.storage==='postgres';if(state.storage!=='postgres')$('#storageWarn').innerHTML='<strong>Armazenamento temporário.</strong> As alterações funcionam agora, mas podem ser perdidas se o serviço reiniciar. Para conservar produtos, configurações, imagens e métricas permanentemente, conecte o PostgreSQL no Render por meio da variável <code>DATABASE_URL</code>.';if(!picked)picked=state.products[0]?.id||'';}
async function save(){try{const r=await api('/api/admin/state','PUT',{settings:state.settings,mode:state.mode,storeTheme:state.storeTheme||'original',musicThemes:state.musicThemes||{},products:state.products});state.updatedAt=r.updatedAt;const check=await fetch('/api/public/theme-status?v='+Date.now(),{cache:'no-store'});if(!check.ok)throw Error('Não foi possível verificar a vitrine pública.');const live=await check.json();if(live.mode!==state.mode.type||live.storeTheme!==(state.storeTheme||'original')||['christmas','newyear','valentines','halloween','easter'].some(k=>live.musicThemes?.[k]!==((state.musicThemes||{})[k]!==false))||(live.mode==='event'&&live.screenTheme!==state.mode.eventTheme))throw Error('A vitrine não confirmou o tema solicitado.');flash('Publicado e confirmado na API pública.');return true;}catch(e){flash(e.message,true);return false}}
function showTab(t){tab=t;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#sidebar').classList.remove('open');const render={overview,catalog:products,content,modes,events,analytics,security}[t]||overview;$('#section').innerHTML=render();if(t==='analytics')loadAnalytics();}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)});$('#menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#logout').addEventListener('click',async()=>{try{await api('/api/admin/logout','POST')}catch{}location.reload()});
function heading(k,title,sub,actions=''){return `<div class="intro"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${sub}</p></div>${actions}</div>`}
function overview(){let shown=state.products.filter(p=>p.visible).length;return heading('VISÃO GERAL','Sua operação em um lugar.','Organize a coleção, acompanhe interações e publique atualizações.')+`<div class="stats"><div class="stat"><span>Produtos</span><b>${state.products.length}</b><small>${shown} visíveis</small></div><div class="stat"><span>Coleção</span><b style="font-size:21px">${esc(state.settings.collection)}</b><small>Identidade atual</small></div><div class="stat"><span>Modo atual</span><b style="font-size:20px">${{normal:'Loja',maintenance:'Manutenção',launch:'Lançamento',event:'Evento'}[state.mode.type]}</b><small>Exibição pública</small></div><div class="stat"><span>Armazenamento</span><b style="font-size:19px">${state.storage==='postgres'?'Persistente':'Temporário'}</b><small>${esc(state.updatedAt?.slice(0,10)||'')}</small></div></div><div class="card"><h2>Controle rápido</h2><p class="secondary">Os clientes não têm acesso ao painel ou às configurações administrativas.</p><div class="actions"><button class="btn" data-go="catalog">Editar produtos</button><button class="btn alt" data-go="content">Editar vitrine</button><button class="btn alt" data-go="modes">Alterar modo da loja</button><button class="btn alt" data-go="analytics">Ver métricas</button></div></div><div class="card"><h2>Orientações importantes</h2><p class="secondary">A loja continua em fase de pré-lançamento. Ativar estoque ou alterar preços não habilita pagamentos automaticamente. Um checkout real precisa de integração com um provedor de pagamento e gestão de pedidos.</p><p class="secondary">A contagem regressiva é calculada a partir do horário de término configurado. Após o prazo, a vitrine volta automaticamente ao modo normal com os dados mais recentes salvos.</p></div>`}
function content(){const s=state.settings;return heading('PERSONALIZAÇÃO','Identidade e conteúdo.','Todos os textos desta seção são exibidos aos visitantes.')+`<div class="card"><h2>Marca e coleção</h2><div class="grid">${input('collection','Nome da coleção',s.collection)}${input('slogan','Slogan da marca',s.slogan)}${input('announcement','Mensagem superior',s.announcement)}${input('instagram','Endereço do Instagram',s.instagram,'url')}${input('supportEmail','E-mail comercial opcional',s.supportEmail,'email')}${input('accent','Cor de destaque',s.accent,'color')}</div></div><div class="card"><h2>Destaque da página inicial</h2><div class="grid">${input('heroEyebrow','Texto pequeno acima do título',s.heroEyebrow)}${input('heroTitle','Título principal',s.heroTitle)}${input('heroAccent','Palavra de destaque',s.heroAccent)}${input('heroImage','URL opcional da imagem principal',s.heroImage)}</div>${textarea('heroText','Descrição do destaque',s.heroText)}</div><div class="card"><h2>Sobre e rodapé</h2>${textarea('aboutText','Texto institucional',s.aboutText,5)}${textarea('footerText','Texto do rodapé',s.footerText)}</div><div class="actions"><button class="btn" id="saveContent">Salvar conteúdo e aparência</button></div>`}
function events(){const theme=state.storeTheme||'original';return heading('EVENTOS E TEMAS','Identidade completa da loja.','Mude cores, logo, partículas e experiência de compra. Esta seção NÃO altera a tela de acesso.')+`<div class="card"><h2>Tema público: ${esc(({original:'Original',christmas:'Natal',newyear:'Ano Novo',valentines:'Dia dos Namorados',halloween:'Halloween',easter:'Páscoa'})[theme]||'Original')}</h2><div class="mode-cards"><button class="mode-card ${theme==='original'?'active':''}" data-event="original"><strong>ORIGINAL</strong><span>Identidade de fábrica da VYRANTE.</span></button><button class="mode-card ${theme==='christmas'?'active':''}" data-event="christmas"><strong>🎄 NATAL</strong><span>Neve, Papai Noel, vermelho, verde, dourado.</span></button><button class="mode-card ${theme==='newyear'?'active':''}" data-event="newyear"><strong>✦ ANO NOVO</strong><span>Dourado, fogos de luz e clima de celebração.</span></button><button class="mode-card ${theme==='valentines'?'active':''}" data-event="valentines"><strong>♥ DIA DOS NAMORADOS</strong><span>Vinho, rosa, flores, corações e elegância romântica.</span></button><button class="mode-card ${theme==='halloween'?'active':''}" data-event="halloween"><strong>🎃 HALLOWEEN</strong><span>Abóboras, lua, roxo, laranja e atmosfera noturna.</span></button><button class="mode-card ${theme==='easter'?'active':''}" data-event="easter"><strong>🐰 PÁSCOA</strong><span>Lavanda, verde suave, flores, ovos e detalhes delicados.</span></button></div><div class="event-music-config"><div class="event-music-heading"><div><h3>Trilhas sonoras dos eventos</h3><p>Ative ou desative a música individualmente. O visual, a neve, os corações e as outras animações continuam iguais.</p></div><span class="audio-optin-note">O visitante sempre escolhe quando ouvir</span></div><div class="event-music-grid">${[['christmas','🎄','Natal','Noite de Luzes'],['newyear','🎆','Ano Novo','Horizontes de Ouro'],['valentines','♥','Dia dos Namorados','Entre Dois Corações'],['halloween','🎃','Halloween','Baile da Meia-Noite'],['easter','🐰','Páscoa','Jardim de Renovação']].map(([id,icon,label,track])=>`<label class="music-option"><span class="music-symbol">${icon}</span><span class="music-details"><strong>${label}</strong><small>${track}</small></span><span class="music-toggle"><input type="checkbox" data-music-theme="${id}" ${state.musicThemes?.[id]!==false?'checked':''} aria-label="Ativar música de ${label}"><span class="music-slider"></span></span></label>`).join('')}</div><p class="helper">Desativar impede que o áudio seja oferecido ou tocado para os visitantes no tema correspondente. As trilhas dos outros eventos não são afetadas.</p></div><p class="helper">Selecione um tema para publicar imediatamente na loja inteira, sem modificar o controle de acesso. Os efeitos sonoros são opcionais.</p><div class="actions"><button class="btn" id="publishEvent">Reconfirmar tema da loja</button><a class="btn alt" href="/" target="_blank" rel="noopener">Ver loja pública</a><button class="btn alt" data-go="modes">Controle de acesso separado</button></div></div>`}
function modes(){const m=state.mode||{type:'normal'},dt=m.endsAt?new Date(m.endsAt).toLocaleString('sv-SE').replace(' ','T').slice(0,16):'';const choices=[['original','Sem tema'],['christmas','🎄 Natal'],['newyear','✦ Ano Novo'],['valentines','♥ Dia dos Namorados'],['halloween','🎃 Halloween'],['easter','🐰 Páscoa']];const selector=`<label class="field"><span>Tema exclusivo da tela de acesso</span><select data-key="eventTheme">${choices.map(([id,title])=>`<option value="${id}" ${m.eventTheme===id?'selected':''}>${title}</option>`).join('')}</select></label>`;return heading('CONTROLE DE ACESSO','Telas temporárias e restrição da loja.','Independente da aba Eventos e temas: esta seção decide quando bloquear ou liberar a navegação.')+`<div class="card"><div class="mode-cards"><button class="mode-card ${m.type==='normal'?'active':''}" data-mode="normal"><strong>Loja normal</strong><span>Libera catálogo com o tema escolhido separadamente.</span></button><button class="mode-card ${m.type==='maintenance'?'active':''}" data-mode="maintenance"><strong>Manutenção</strong><span>Bloqueia a navegação e mostra a mensagem de manutenção.</span></button><button class="mode-card ${m.type==='launch'?'active':''}" data-mode="launch"><strong>Novo lançamento</strong><span>Bloqueia a loja com contagem para o lançamento.</span></button><button class="mode-card ${m.type==='event'?'active':''}" data-mode="event"><strong>Evento (tela)</strong><span>Tela temática com contador, independente do tema da vitrine.</span></button></div><div class="grid">${input('modeEnds','Voltar à loja normal em (opcional)',dt,'datetime-local')}${input('modeTitle','Título da tela',m.title||'')}${input('modeBackground','URL opcional de imagem de fundo',m.background||'')}${selector}</div>${textarea('modeSubtitle','Mensagem da tela',m.subtitle||'',3)}<p class="helper">Manutenção, Novo lançamento e Evento mostram uma tela temporária com seu contador. Se houver data de término, a navegação retorna automaticamente à loja e o tema da vitrine permanece intacto. Música original opcional, iniciada somente após um toque.</p><div class="actions"><button class="btn" id="saveMode">Publicar controle de acesso</button><button class="btn alt" data-go="events">Temas da vitrine</button></div></div>`}
const photoFallback=(id,kind='main')=>'/api/catalog-image/'+encodeURIComponent(id)+'/'+kind;
function effectivePhotos(p){const own=(p?.images||[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,10);return own.length?own:[photoFallback(p.id),photoFallback(p.id,'detail')];}
function galleryEditor(p){return '<div class="adm-photo-gallery" aria-label="Ordenar fotos do produto">'+effectivePhotos(p).map((url,i)=>'<div class="adm-photo-entry"><div class="adm-photo-visual"><img src="'+esc(url)+'" alt="Foto '+(i+1)+' do produto" loading="lazy" onerror="this.onerror=null;this.src=\''+photoFallback(p.id)+'\'"><span class="adm-photo-number">'+(i===0?'CAPA':(i+1)+'ª FOTO')+'</span></div><div class="adm-photo-actions"><button type="button" data-photo-action="first" data-photo-index="'+i+'" '+(i===0?'disabled':'')+' title="Definir como imagem principal">Capa</button><button type="button" data-photo-action="up" data-photo-index="'+i+'" '+(i===0?'disabled':'')+' aria-label="Mover foto para a esquerda">←</button><button type="button" data-photo-action="down" data-photo-index="'+i+'" '+(i===effectivePhotos(p).length-1?'disabled':'')+' aria-label="Mover foto para a direita">→</button><button type="button" data-photo-action="remove" data-photo-index="'+i+'" aria-label="Remover foto">×</button></div></div>').join('')+'</div>';}
function products(){let p=state.products.find(x=>x.id===picked)||state.products[0];if(!p)return heading('CATÁLOGO','Produtos','')+`<button class="btn" id="newProduct">Novo produto</button>`;return heading('CATÁLOGO','Produtos e estoque.','Edite preços, descrições, tamanhos, fotos, disponibilidade e visibilidade.',`<button class="btn alt" id="newProduct">Novo produto</button>`)+`<div class="product-editor"><div class="product-list">${state.products.map(x=>`<button data-pick="${esc(x.id)}" class="${picked===x.id?'active':''}"><img src="${esc(effectivePhotos(x)[0]) }" alt="" onerror="this.style.visibility='hidden'"><div><div class="itemname">${esc(x.title)}</div><div class="itemprice">${cash(x.price)} · ${x.visible?'Visível':'Oculto'}</div></div></button>`).join('')}</div><div class="card" style="margin:0"><div class="card-head"><h2>${esc(p.title)}</h2><button class="btn danger small" id="deleteProduct">Excluir</button></div><div class="grid">${input('title','Nome comercial',p.title)}${input('price','Preço (R$)',p.price,'number','min="0" step="0.01"')}${input('type','Tipo de produto',p.type)}${input('color','Nome da cor',p.color)}${input('hex','Cor na vitrine',p.hex,'color')}<label class="field"><span>Categoria de público</span><select data-product-key="gender"><option value="masculino" ${p.gender==='masculino'?'selected':''}>Masculino</option><option value="feminino" ${p.gender==='feminino'?'selected':''}>Feminino</option><option value="unissex" ${p.gender==='unissex'?'selected':''}>Unissex</option></select></label><label class="field"><span>Linha</span><select data-product-key="line">${['performance','form','recovery'].map(x=>`<option value="${x}" ${p.line===x?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select></label>${input('sizes','Tamanhos (separados por vírgula)',p.sizes.join(', '))}${input('maxPerOrder','Máximo de peças por tamanho na seleção (1 a 10)',p.maxPerOrder||10,'number','min="1" max="10" step="1"')}${input('status','Status comercial',p.status||'Em breve')}</div>${textarea('description','Descrição principal',p.description,4)}${textarea('material','Material / composição',p.material,3)}${textarea('fit','Caimento',p.fit,2)}${textarea('feature','Destaques',p.feature,3)}<div class="switchline"><div><strong>Visível na loja</strong><div class="helper">Desativar remove o produto do catálogo público.</div></div><input type="checkbox" data-product-key="visible" ${p.visible?'checked':''}></div><h3 style="margin:26px 0 12px">Estoque por tamanho</h3><div class="stock">${p.sizes.map(s=>`<label>${esc(s)}<input type="number" min="0" max="999999" data-stock="${esc(s)}" value="${Number(p.inventory?.[s]||0)}"></label>`).join('')}</div><h3 style="margin:28px 0 12px">Imagens do produto</h3><p class="helper">A primeira foto será a capa na vitrine. Use as setas para ordenar (até 10 fotos no total). Você também pode deslizar pelas imagens na página do cliente.</p>${galleryEditor(p)}<div class="pimage"><img id="productPreview" src="${esc(effectivePhotos(p)[0]) }" alt="Prévia da imagem" onerror="this.style.opacity='.08'"><div>${textarea('images','URLs das imagens, uma por linha (até 10)',effectivePhotos(p).join('\n'),4)}<label class="field"><span>Adicionar fotos PNG, JPG ou WebP (até 6 MB por arquivo)</span><input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><button class="btn alt small" id="uploadImage">Enviar fotos selecionadas</button><p class="helper">As fotos originais aparecem automaticamente. Você pode acrescentar imagens, reordenar e selecionar a capa.</p></div></div><div class="actions"><button id="saveProduct" class="btn">Salvar produto</button></div></div></div>`}
function analytics(){return heading('MÉTRICAS','Visão de audiência.','Medições agregadas e anônimas; não equivalem a pedidos ou receita.')+`<div id="metricsContainer" class="card"><p>Carregando métricas...</p></div>`}
function security(){return heading('SEGURANÇA','Proteja seu painel.','Ações administrativas exigem sessão autenticada.')+`<div class="card"><h2>Alterar senha de acesso</h2><p class="secondary">Use uma senha exclusiva de pelo menos 14 caracteres. Após trocar, guarde-a em local seguro.</p><form id="passwordForm"><label class="field"><span>Senha atual</span><input type="password" id="currentPassword" autocomplete="current-password" required></label><label class="field"><span>Nova senha</span><input type="password" id="newPassword" autocomplete="new-password" minlength="14" required></label><button class="btn">Alterar senha</button></form></div><div class="card"><h2>Estado da proteção</h2><p>Login exigido: <b>Sim</b></p><p>Cookies da sessão: <b>HttpOnly e Secure</b></p><p>Proteção contra tentativas de força bruta: <b>Ativa</b></p><p>Validação de operações: <b>Ativa</b></p><p class="secondary">O site público não inclui o endereço deste painel em sua navegação.</p></div>`}
function assignProduct(){const p=state.products.find(p=>p.id===picked);if(!p)return;$$('[data-key]').forEach(el=>{if(el.dataset.key==='sizes')p.sizes=el.value.split(',').map(s=>s.trim()).filter(Boolean);else if(el.dataset.key==='images')p.images=el.value.split('\n').map(s=>s.trim()).filter(Boolean);else if(el.dataset.key==='price')p.price=Number(el.value||0);else if(el.dataset.key==='maxPerOrder')p.maxPerOrder=Math.max(1,Math.min(10,Math.trunc(Number(el.value)||10)));else p[el.dataset.key]=el.value;});$$('[data-product-key]').forEach(el=>{p[el.dataset.productKey]=el.type==='checkbox'?el.checked:el.value;});$$('[data-stock]').forEach(el=>{p.inventory=p.inventory||{};p.inventory[el.dataset.stock]=Number(el.value||0);});}
function updateSettings(){let s=state.settings;$$('[data-key]').forEach(el=>{s[el.dataset.key]=el.value})}
function updateMode(){let m=state.mode;const time=$('[data-key="modeEnds"]')?.value;m.endsAt=time?new Date(time).toISOString():null;m.title=$('[data-key="modeTitle"]')?.value||'';m.background=$('[data-key="modeBackground"]')?.value||'';m.subtitle=$('[data-key="modeSubtitle"]')?.value||'';m.eventTheme=$('[data-key="eventTheme"]')?.value||m.eventTheme||'original';}
async function loadAnalytics(){try{const d=await api('/api/admin/metrics'),today=new Date().toISOString().slice(0,10),day7=new Date(Date.now()-6*86400000).toISOString().slice(0,10);report=d;const data=d.data.filter(x=>x.day>=day7),count=k=>data.filter(x=>x.kind===k).reduce((a,b)=>a+Number(b.count),0),daily=Array.from({length:7},(_,i)=>{let date=new Date(Date.now()-(6-i)*86400000).toISOString().slice(0,10);return {date,views:data.filter(x=>x.day===date&&x.kind==='pageview').reduce((a,b)=>a+b.count,0)}});const max=Math.max(1,...daily.map(x=>x.views));const prods=data.filter(x=>x.kind==='productview').sort((a,b)=>b.count-a.count).slice(0,8);$('#metricsContainer').innerHTML=`<div class="stats"><div class="stat"><span>Visualizações</span><b>${count('pageview')}</b><small>Últimos 7 dias</small></div><div class="stat"><span>Produtos vistos</span><b>${count('productview')}</b><small>Últimos 7 dias</small></div><div class="stat"><span>Adições à sacola</span><b>${count('add_to_cart')}</b><small>Últimos 7 dias</small></div><div class="stat"><span>Buscas</span><b>${count('search')}</b><small>Últimos 7 dias</small></div></div><h2>Visualizações diárias</h2><div class="graph">${daily.map(x=>`<div class="bar" style="height:${Math.max(2,x.views/max*100)}%"><span>${esc(x.date)}: ${x.views}</span></div>`).join('')}</div><p class="helper">Últimos 7 dias, em UTC. Visualizações não indicam visitantes únicos.</p><h2 style="margin-top:25px">Peças mais visualizadas</h2><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Visualizações</th></tr></thead><tbody>${prods.length?prods.map(x=>`<tr><td>${esc(state.products.find(p=>p.id===x.product)?.title||x.product)}</td><td>${x.count}</td></tr>`).join(''):'<tr><td colspan="2">Ainda não há dados suficientes.</td></tr>'}</tbody></table></div><p class="helper">Fonte: eventos agregados da própria loja. Pedidos e faturamento não estão conectados a um meio de pagamento.</p>`}catch(e){$('#metricsContainer').textContent=e.message}}
document.addEventListener('change',async e=>{const toggle=e.target.closest('[data-music-theme]');if(!toggle)return;const name=toggle.dataset.musicTheme;if(!['christmas','newyear','valentines','halloween','easter'].includes(name))return;state.musicThemes={...(state.musicThemes||{}),[name]:toggle.checked};const success=await save();if(!success){await reload();showTab('events');return;}showTab('events');});
document.addEventListener('click',async e=>{const t=e.target;if(t.closest('[data-go]')){showTab(t.closest('[data-go]').dataset.go);return;}if(t.closest('[data-pick]')){if(tab==='catalog')assignProduct();picked=t.closest('[data-pick]').dataset.pick;showTab('catalog');return;}if(t.closest('[data-event]')){const theme=t.closest('[data-event]').dataset.event;const campaigns={original:['',''],christmas:['VYRANTE CHRISTMAS EDITION','A magia do Natal encontra a sua evolução.'],newyear:['VYRANTE NEW YEAR EDITION','Um novo ano. Uma nova versão de você.'],valentines:['VYRANTE LOVE EDITION','Amor em cada movimento. Conexão em cada conquista.'],halloween:['VYRANTE HALLOWEEN EDITION','Coragem para superar limites. Estilo para desafiar a noite.'],easter:['VYRANTE EASTER EDITION','Renove sua energia. Celebre novos começos.']};if(!campaigns[theme])return;const [title,subtitle]=campaigns[theme];state.storeTheme=theme;showTab('events');const ok=await save();if(!ok){await reload();showTab('events');}return;}if(t.closest('#publishEvent')){const ok=await save();if(!ok)await reload();showTab('events');return;}if(t.closest('[data-mode]')){const type=t.closest('[data-mode]').dataset.mode;const samples={normal:['',''],maintenance:['Estamos aprimorando sua experiência.','Voltamos em breve.'],launch:['Algo novo está chegando.','O próximo capítulo começa em breve.'],event:['UMA EXPERIÊNCIA ESPECIAL ESTÁ CHEGANDO','Acompanhe a contagem regressiva da VYRANTE.']};const [title,subtitle]=samples[type]||samples.normal;state.mode={...state.mode,type,title,subtitle,endsAt:type==='normal'?null:state.mode.endsAt,eventTheme:type==='event'?'christmas':'original'};showTab('modes');return;}if(t.closest('[data-photo-action]')){const btn=t.closest('[data-photo-action]');assignProduct();const p=state.products.find(p=>p.id===picked);if(!p)return;const list=effectivePhotos(p).slice(0,10),i=Number(btn.dataset.photoIndex),action=btn.dataset.photoAction;if(!Number.isInteger(i)||i<0||i>=list.length)return;if(action==='remove')list.splice(i,1);else if(action==='first'&&i>0)list.unshift(list.splice(i,1)[0]);else if(action==='up'&&i>0)[list[i-1],list[i]]=[list[i],list[i-1]];else if(action==='down'&&i<list.length-1)[list[i],list[i+1]]=[list[i+1],list[i]];else return;p.images=list;const ok=await save();if(!ok)await reload();showTab('catalog');return;}
if(t.closest('#newProduct')){const id='novo-'+Date.now().toString(36);state.products.unshift({id,title:'Nova peça',type:'Roupas fitness',gender:'unissex',line:'performance',price:0,color:'Preto profundo',hex:'#111313',sizes:['P','M','G','GG'],fit:'',material:'',description:'',feature:'',tags:[],images:[],visible:false,inventory:{P:0,M:0,G:0,GG:0},status:'Em breve'});picked=id;showTab('catalog');return;}
if(t.closest('#deleteProduct')){if(!confirm('Deseja excluir este produto da loja?'))return;state.products=state.products.filter(p=>p.id!==picked);picked=state.products[0]?.id;await save();showTab('catalog');return;}
if(t.closest('#saveProduct')){assignProduct();await save();showTab('catalog');return;}
if(t.closest('#saveContent')){updateSettings();await save();showTab('content');return;}
if(t.closest('#saveMode')){updateMode();await save();showTab('modes');return;}
if(t.closest('#uploadImage')){const files=[...($('#imageUpload')?.files||[])];if(!files.length){flash('Selecione uma ou mais imagens.',true);return;}if(files.some(f=>f.size>6000000)){flash('Limite de 6 MB por imagem.',true);return;}assignProduct();const p=state.products.find(p=>p.id===picked);if(!p)return;p.images=effectivePhotos(p).slice(0,10);if(p.images.length+files.length>10){flash('O produto pode ter no máximo 10 imagens. Remova algumas antes de enviar.',true);return;}let done=0;try{t.disabled=true;for(const file of files){const response=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':file.type,'X-Admin-Token':csrf},credentials:'same-origin',body:file});const result=await response.json();if(!response.ok)throw Error(result.error||'Falha no envio.');p.images.push(location.origin+result.url);done++;}const ok=await save();if(!ok)await reload();showTab('catalog');if(ok)flash(done+' foto(s) adicionada(s). Você pode definir a capa e a ordem.');}catch(err){if(done)await save();showTab('catalog');flash('Enviadas '+done+' fotos. '+err.message,true)}finally{t.disabled=false}return;}});
document.addEventListener('submit',async e=>{if(e.target.id!=='passwordForm')return;e.preventDefault();try{await api('/api/admin/password','POST',{current:$('#currentPassword').value,next:$('#newPassword').value});e.target.reset();flash('Senha atualizada com segurança.')}catch(err){flash(err.message,true)}});
init();
</script></body></html>
