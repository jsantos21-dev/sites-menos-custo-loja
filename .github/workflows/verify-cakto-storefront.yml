name: Build and verify Sites Menos Custo 2.0
on:
  push:
    branches: [main]
    paths:
      - "build_v2.py"
      - "v2.css"
      - "v2.js"
      - "cakto-checkouts.json"
      - "Sites_Menos_Custo_REPOSITORIO_PARA_RENDER.zip"
      - ".github/workflows/verify-cakto-storefront.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sites-menos-custo-v2-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source code
        run: |
          python3 -m py_compile build_v2.py
          node --check v2.js
      - name: Generate and validate v2 site
        run: python3 build_v2.py
      - name: Verify 35 official Cakto offers, legal pages and privacy
        run: |
          python3 - <<'PY'
          import json,zipfile,re
          from pathlib import Path
          config=json.loads(Path('cakto-checkouts.json').read_text(encoding='utf-8'))
          urls=config['checkouts']
          assert len(urls)==len(set(urls.values()))==35
          with zipfile.ZipFile('Sites_Menos_Custo_REPOSITORIO_PARA_RENDER.zip') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              main=z.read('index.html').decode('utf-8')
              assert 'smc-version' in main
              for bad in ('Meu pedido','Pagamento Pix','Comprovante Pix','addToCart('):
                  assert bad not in main,bad
              for must in ('#pacotes','#templates','@sitesmenoscusto','/cookies.html','/termos.html','/reembolsos.html','v2.css','v2.js'):
                  assert must in main,must
              for sku,url in urls.items():
                  assert url.startswith('https://pay.cakto.com.br/')
                  source=z.read('produtos/'+sku+'.html').decode('utf-8')
                  assert url in source,(sku,'missing matching checkout')
                  assert '/previews/'+sku+'.webp' in source
                  assert 'data-smc-checkout' in source
                  assert 'rel="canonical"' in source
                  assert 'application/ld+json' in source
                  assert '/termos.html' in source
                  assert '/reembolsos.html' in source
              for n in ('entrega.html','termos.html','privacidade.html','cookies.html','reembolsos.html','robots.txt','sitemap.xml','v2.js','v2.css'):
                  assert n in names,n
              for n in names:
                  assert not n.startswith(('arquivos_individuais/','pacotes/','modelos/')),n
              assert 'smc_consent_v2' in z.read('v2.js').decode('utf-8')
              assert 'Recusar opcionais' in z.read('v2.js').decode('utf-8')
              assert 'Personalizar' in z.read('v2.js').decode('utf-8')
              print('Verified 35 product detail pages, checkouts, policies, cookies, public assets and privacy.')
          PY
      - name: Commit updated public ZIP and homepage snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sites_Menos_Custo_REPOSITORIO_PARA_RENDER.zip storefront-public-index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish professional Sites Menos Custo 2.0 storefront"
            git pull --rebase
            git push
          fi
