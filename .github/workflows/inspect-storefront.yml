name: Inspect storefront source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-storefront.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pricing and checkout interactions
        run: |
          python3 - <<'PY'
          import zipfile,re
          with zipfile.ZipFile('Sites_Menos_Custo_REPOSITORIO_PARA_RENDER.zip') as z:
            s=z.read('index.html').decode('utf-8','replace')
            print('ZIP FILES', len(z.namelist()),'HTML SIZE',len(s))
            print('BODY_START',repr(s[s.find('<body'):s.find('<body')+2300]))
            print('DOM IDS',re.findall(r'id="([^"]+)"',s)[:80])
            for m in list(re.finditer(r'(?:R\$\s*997|997(?:[.,]00)?|P10|pix-dialog|pix-overlay|finalizar|solicitar|comprar|pedido)',s,re.I))[-48:]:
              if m.start()<13000:continue
              print('MATCH',m.start(),repr(s[max(0,m.start()-220):m.start()+420]))
            p=s.rfind('<script')
            print('LASTSCRIPT',p,repr(s[p:p+18500]))
          PY
